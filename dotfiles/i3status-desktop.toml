icons_format = "{icon}"

[theme]
theme = "plain"

# Rose Pine (main) — no built-in theme in i3status-rs
[theme.overrides]
idle_bg = "#191724"
idle_fg = "#e0def4"
info_bg = "#9ccfd8"
info_fg = "#191724"
good_bg = "#31748f"
good_fg = "#e0def4"
warning_bg = "#f6c177"
warning_fg = "#191724"
critical_bg = "#eb6f92"
critical_fg = "#191724"
separator = ""
separator_bg = "auto"
separator_fg = "auto"

[icons]
icons = "awesome4"

[[block]]
block = "cpu"
info_cpu = 20
warning_cpu = 50
critical_cpu = 90

[[block]]
block = "temperature"

[[block]]
block = "memory"
format = " $icon $mem_total_used_percents.eng(w:2) "
format_alt = " $icon_swap $swap_used_percents.eng(w:2) "

[[block]]
block = "time"
interval = 5
format = " $timestamp.datetime(f:'%a %d/%m %R') "
