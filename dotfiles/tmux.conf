set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'rose-pine/tmux'
set -g @plugin 'sainnhe/tmux-fzf'

set -g @rose_pine_variant 'main'
set -g @rose_pine_bar_bg_disable 'on'
set -g @rose_pine_bar_bg_disabled_color_option 'default'
set -g @rose_pine_disable_active_window_menu 'on'
set -g @rose_pine_status_left_prepend_section ' '

set -g base-index 1
set -g default-terminal "tmux-256color"
set -g repeat-time 600
# Allow cursor-shape (DECSCUSR) to pass through so `cursor-style bar` works
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
set -gw pane-base-index 1
set -gw xterm-keys on
set -g renumber-windows on
set -g cursor-style bar
# "always" rather than "on": with "on" tmux only forwards extended keys to an
# app that asked for them the old xterm way, so apps speaking the newer kitty
# protocol (anything built on crossterm) never receive shift/ctrl+enter at all.
# csi-u is the form those apps can read; the "xterm" default is not.
set -s extended-keys always
set -s extended-keys-format csi-u
# Reset to tmux defaults before appending so reloads do not duplicate entries.
set -su terminal-features
set -as terminal-features ',xterm-ghostty:extkeys:RGB:clipboard'

# QOL
set -g mouse on                  # toggle with prefix+m
set -g detach-on-destroy off     # killing a session jumps to another instead of detaching
set -gw mode-keys vi
set -g set-clipboard on          # copy in tmux -> system clipboard via OSC 52 (Ghostty)
set -g allow-passthrough on      # kitty image protocol etc. works inside tmux (Ghostty)

# vim-style selection in copy mode (y = yank via tmux-yank)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle

# Reload config (moved off 'r', which is now rename-window)
bind R source-file ~/.tmux.conf \; display "Config reloaded"

# Jump to previous window (default 'l' is shadowed by pane nav below)
bind Tab last-window
# ^ toggles back to wherever you just were. last-window only ever looks inside
# the current session, and most sessions here hold a single window - so fall
# back to the previous session, which is what "the last one" means in that case.
# (^ is shift+6; with extended-keys/csi-u the terminal may report it as either
# the caret or the shifted digit, so claim both spellings.)
bind ^   if-shell -F '#{>:#{session_windows},1}' last-window 'switch-client -l'
bind S-6 if-shell -F '#{>:#{session_windows},1}' last-window 'switch-client -l'

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Repeatable pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind C-l send-keys C-l

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind m set -g mouse \; display "Mouse: #{?mouse,ON,OFF}"

bind -n F1 if-shell 'tmux select-window -t :1' '' 'new-window -t :1 -c "#{pane_current_path}"'
bind -n F2 if-shell 'tmux select-window -t :2' '' 'new-window -t :2 -c "#{pane_current_path}"'
bind -n F3 if-shell 'tmux select-window -t :3' '' 'new-window -t :3 -c "#{pane_current_path}"'
bind -n F4 if-shell 'tmux select-window -t :4' '' 'new-window -t :4 -c "#{pane_current_path}"'
bind -n F5 if-shell 'tmux select-window -t :5' '' 'new-window -t :5 -c "#{pane_current_path}"'
bind -n F6 if-shell 'tmux select-window -t :6' '' 'new-window -t :6 -c "#{pane_current_path}"'
bind -n F7 if-shell 'tmux select-window -t :7' '' 'new-window -t :7 -c "#{pane_current_path}"'
bind -n F8 if-shell 'tmux select-window -t :8' '' 'new-window -t :8 -c "#{pane_current_path}"'

# Move current window left/right with Ctrl-Shift-arrows
bind -n C-S-Left swap-window -t -1 \; select-window -t -1
bind -n C-S-Right swap-window -t +1 \; select-window -t +1

run '~/.tmux/plugins/tpm/tpm'

# Keep every tmux surface transparent. These must follow TPM so themes cannot
# replace the terminal's default background with an opaque colour.
set -g window-style 'fg=#908caa,bg=default'
set -g window-active-style 'fg=#e0def4,bg=default'
set -g status-style 'fg=#31748f,bg=default'
set -g message-style 'fg=#6e6a86,bg=default'
set -g message-command-style 'fg=#f6c177,bg=default'
set -g popup-style 'bg=default'
set -g popup-border-style 'fg=#26233a,bg=default'

# Modal prompts, back on the shell scripts now that muxly is gone.
# Both read a line and abort on Escape / Ctrl-C / empty input.
#
# display-popup -E runs the command through sh, so $DOTFILES expands — .zshrc
# exports it, and the tmux server inherits it from the shell that started it.
# The fallback covers a server started from somewhere that never sourced it.
bind n display-popup -E -w 50 -h 3 -T '#[fg=#e0def4] new session #[fg=#26233a]' '"${DOTFILES:-$HOME/kickstart/dotfiles}"/tmux/tmux-session.sh'
bind r display-popup -E -w 50 -h 3 -T '#[fg=#e0def4] rename session or window? #[fg=#26233a]' '"${DOTFILES:-$HOME/kickstart/dotfiles}"/tmux/tmux-rename.sh'

# How you got into this pane — see DEV_VIA in .zshrc. After tpm so it appends to
# the theme's status-right rather than being replaced by it, and conditional so
# a pane nothing set up (a plain ssh, or this laptop) shows nothing at all.
set -ga update-environment 'DEV_VIA'
set -ga status-right '#{?@dev_via,#[fg=#6e6a86] #{@dev_via} ,}'

# Hide pane split border/indicator (after tpm so it overrides rose-pine)
set -g pane-border-indicators off
set -g pane-border-lines simple
# fg must clear ghostty's minimum-contrast=1.1 vs the #191724 bg, or ghostty
# force-brightens it back to visible gray; #26233a passes and stays near-invisible
set -g pane-border-style 'fg=#26233a,bg=default'
set -g pane-active-border-style 'fg=#26233a,bg=default'

# Sticky resize mode: prefix + Ctrl-arrow starts resizing and stays armed, so plain
# arrows (or Ctrl-arrows / hjkl) keep resizing with no prefix and no repeat-time race.
# Any other key (Escape, q, ...) leaves the mode.
bind -T prefix C-Left  resize-pane -L 5 \; switch-client -T resize
bind -T prefix C-Right resize-pane -R 5 \; switch-client -T resize
bind -T prefix C-Up    resize-pane -U 3 \; switch-client -T resize
bind -T prefix C-Down  resize-pane -D 3 \; switch-client -T resize

bind -T resize Left    resize-pane -L 5 \; switch-client -T resize
bind -T resize Right   resize-pane -R 5 \; switch-client -T resize
bind -T resize Up      resize-pane -U 3 \; switch-client -T resize
bind -T resize Down    resize-pane -D 3 \; switch-client -T resize
bind -T resize C-Left  resize-pane -L 5 \; switch-client -T resize
bind -T resize C-Right resize-pane -R 5 \; switch-client -T resize
bind -T resize C-Up    resize-pane -U 3 \; switch-client -T resize
bind -T resize C-Down  resize-pane -D 3 \; switch-client -T resize
bind -T resize h       resize-pane -L 5 \; switch-client -T resize
bind -T resize l       resize-pane -R 5 \; switch-client -T resize
bind -T resize k       resize-pane -U 3 \; switch-client -T resize
bind -T resize j       resize-pane -D 3 \; switch-client -T resize
bind -T resize z       resize-pane -Z \; switch-client -T resize

# Ctrl+Up scrolls back into history; Ctrl+Down scrolls forward (auto-exits at bottom)
bind -n C-Up copy-mode -e \; send-keys -X scroll-up
bind -T copy-mode C-Up send-keys -X scroll-up
bind -T copy-mode C-Down send-keys -X scroll-down
bind -T copy-mode-vi C-Up send-keys -X scroll-up
bind -T copy-mode-vi C-Down send-keys -X scroll-down
